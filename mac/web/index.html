<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>码桥连接</title>
<style>html{color-scheme:dark;font:16px system-ui;background:#101114;color:#eee}body{max-width:650px;margin:64px auto;padding:0 24px}section{background:#1b1d23;padding:24px;border-radius:18px;margin:20px 0}button{font:inherit;color:#fff;background:#335bd7;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.45}p{line-height:1.7;color:#bfc3cc}pre{white-space:pre-wrap;word-break:break-all}#error{color:#ffb4a9}</style>
<h1>码桥 · 连接手机</h1><p>电脑保持运行，手机即可继续同一桌面会话。</p>
<section><h2>桌面连接</h2><p id="status" role="status">正在检测…</p><p id="desktop-note">首次接入独立 Codex 时启用共享入口；随后通过码桥打开 Codex。不会关闭正在运行的任务。</p><button id="desktop">启用桌面共享入口</button> <button id="open-desktop" hidden>打开 Codex</button><p id="relay"></p><button id="pair" disabled>连接手机</button><p id="error" role="alert"></p></section>
<section id="pairings" hidden><h2>配对请求</h2><div id="offers"></div></section><section><h2>已连接设备</h2><div id="devices">暂无设备</div></section>
<section><h2>组件管理</h2><p id="login"></p><button id="autostart">启用登录自动连接</button> <button id="disable">关闭登录自动连接</button><p><button id="stop">停用码桥组件</button></p><p>停用会移除登录启动项并关闭连接。聊天和配对数据保留；应用文件可从应用程序目录移除。</p></section>
<script>
let csrf='';const $=id=>document.getElementById(id);
async function api(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:body?JSON.stringify(body):undefined});let v=await r.json();if(!r.ok)throw Error(v.error);return v}
function button(label,action){let b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{await action();await refresh()}catch(e){$('error').textContent=e.message}finally{b.disabled=false}};return b}
async function refresh(){try{let s=await api('/api/status');$('login').textContent=s.autostart?'已启用登录自动连接':'登录自动连接未启用';$('status').textContent=s.connected?'已确认桌面实例':s.reason||'桌面尚未连接';$('desktop').hidden=!!s.connected;$('open-desktop').hidden=!s.desktopConfigured||!!s.connected;$('desktop-note').textContent=s.connected?'桌面和手机使用同一个真实 App Server。':s.desktopConfigured?'共享入口已启用，请通过码桥打开 Codex，已有窗口需等下次正常启动；已有任务保持运行。':'首次接入独立 Codex 时启用共享入口；随后通过码桥打开 Codex，不会关闭任务。';$('relay').textContent=s.relayReady?'手机连接服务已连接':s.relayConfigured?'手机连接服务暂不可达':'此开发包尚未配置已发布的手机连接服务';if(s.desktopError||s.connectionError)$('error').textContent=s.desktopError||s.connectionError;$('pair').disabled=!s.connected||!s.relayReady;$('devices').replaceChildren();for(let d of s.devices||[]){let p=document.createElement('p');p.textContent=d.name+' ';p.append(button('撤销',()=>api('/api/devices/'+d.id+'/revoke',{})));$('devices').append(p)}if(!(s.devices||[]).length)$('devices').textContent='暂无设备';$('offers').replaceChildren();for(let o of s.pairings||[]){let p=document.createElement('p');p.textContent=o.name||'等待手机扫码';if(o.qr){let img=document.createElement('img');img.src=o.qr;img.alt='两分钟有效的手机配对二维码';img.style.width='260px';img.style.display='block';p.append(img)}if(o.fingerprint){let f=document.createElement('pre');f.textContent=o.fingerprint;p.append(f)}if(o.state==='claimed'&&o.phoneReady){p.append(button('确认连接',()=>api('/api/pairings/'+o.id+'/approve',{})),button('拒绝',()=>api('/api/pairings/'+o.id+'/reject',{})))}$('offers').append(p)}$('pairings').hidden=!(s.pairings||[]).length}catch(e){$('error').textContent=e.message;$('pair').disabled=true}}
$('desktop').onclick=async()=>{if(!confirm('启用后，通过码桥打开的 Codex 将连接共享桌面服务。该设置仅用于指定应用的启动进程；码桥不关闭当前 Codex。是否启用？'))return;try{await api('/api/desktop/enable',{});await refresh()}catch(e){$('error').textContent=e.message}};
$('open-desktop').onclick=async()=>{try{await api('/api/desktop/open',{});await refresh()}catch(e){$('error').textContent=e.message}};
$('autostart').onclick=async()=>{try{await api('/api/autostart',{enabled:true});await refresh()}catch(e){$('error').textContent=e.message}};
$('disable').onclick=async()=>{try{await api('/api/autostart',{enabled:false});await refresh()}catch(e){$('error').textContent=e.message}};
$('stop').onclick=async()=>{try{await api('/api/uninstall',{});$('status').textContent='正在停用组件'}catch(e){$('error').textContent=e.message}};
$('pair').onclick=async()=>{try{await api('/api/pairings',{});await refresh()}catch(e){$('error').textContent=e.message}};
(async()=>{let capability=new URLSearchParams(location.hash.slice(1)).get('bootstrap');history.replaceState(null,'','/');try{if(capability)csrf=(await api('/api/bootstrap',{capability})).csrf;else throw Error('请从码桥组件重新打开配置页面');await refresh();setInterval(refresh,5000)}catch(e){$('status').textContent='未授权';$('error').textContent=e.message}})();
</script></html>
